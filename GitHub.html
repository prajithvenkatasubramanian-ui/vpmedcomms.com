<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — VP MedComms Agency</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
      background: #F5F5F7;
      color: #1D1D1F;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(210, 210, 215, 0.6);
      border-radius: 28px;
      padding: 56px 40px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
    }
    .code {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #0071E3;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 36px;
      font-weight: 600;
      letter-spacing: -0.025em;
      margin-bottom: 14px;
    }
    p {
      font-size: 17px;
      line-height: 1.5;
      color: #6E6E73;
      margin-bottom: 32px;
    }
    a {
      display: inline-block;
      background: #0071E3;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      padding: 12px 26px;
      border-radius: 999px;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    a:hover {
      background: #0066CC;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">Error 404</div>
    <h1>Page not found.</h1>
    <p>The page you are looking for does not exist or may have been moved.</p>
    <a href="/">Return to VP MedComms Agency</a>
  </main>
</body>
</html>
